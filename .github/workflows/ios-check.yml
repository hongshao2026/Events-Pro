name: iOS simulator compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'app-release.config.json'
      - '.github/workflows/ios-check.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run ios:sync
      - run: npm run ios:check
      - name: Compile without signing or upload
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
